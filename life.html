<style>
.m-filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
.m-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: .9rem; cursor: pointer; }
.m-chip svg { width: 16px; height: 16px; color: var(--accent); }
.m-chip span { color: var(--muted); font-size: .8rem; }
.m-chip:hover { border-color: var(--accent); }
.m-chip.is-on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.m-chip.is-on svg, .m-chip.is-on span { color: var(--accent-text); }
.m-grid { columns: 3 260px; column-gap: 18px; }
.m-card { break-inside: avoid; margin: 0 0 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.m-card[hidden] { display: none; }
.m-media { display: block; position: relative; width: 100%; padding: 0; border: 0; background: var(--surface-2); cursor: zoom-in; }
.m-media img { display: block; width: 100%; height: auto; transition: transform .35s ease; }
.m-card:hover .m-media img { transform: scale(1.03); }
.m-vlog .m-media { cursor: pointer; aspect-ratio: 16 / 9; overflow: hidden; }
.m-vlog .m-media img { height: 100%; object-fit: cover; }
.m-play { position: absolute; inset: 0; margin: auto; width: 58px; height: 58px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; }
.m-play svg { width: 26px; height: 26px; margin-left: 3px; }
.m-body { padding: 14px 16px 16px; }
.m-body h3 { margin: 6px 0 2px; font-size: 1.02rem; line-height: 1.35; }
.m-kind { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.m-kind svg { width: 14px; height: 14px; color: var(--accent); }
.m-caption { margin: 6px 0 0; line-height: 1.45; }
.m-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 6px 0 0; font-size: .85rem; color: var(--muted); }
.m-place { display: inline-flex; align-items: center; gap: 4px; }
.m-place svg { width: 14px; height: 14px; }
.m-text { margin: 8px 0 0; font-size: .93rem; line-height: 1.55; }
.m-quote { padding: 18px 20px 18px; background: linear-gradient(160deg, var(--accent-soft), var(--surface) 70%); }
.m-quote blockquote { margin: 10px 0 0; padding: 0; border: 0; position: relative; }
.m-quote blockquote p { margin: 0; font-family: "Source Serif 4", Georgia, serif; font-size: 1.16rem; line-height: 1.5; font-style: italic; }
.m-author { margin: 10px 0 0; text-align: right; font-size: .9rem; color: var(--muted); }
.m-empty { color: var(--muted); }
/* lightbox */
.m-lightbox { width: min(1000px, calc(100vw - 32px)); max-height: calc(100vh - 40px); padding: 0; border: 0; border-radius: 14px; background: #0f141b; color: #e5e9f0; overflow: hidden; }
.m-lightbox::backdrop { background: rgba(8, 10, 14, .82); }
.lb-stage img { display: block; max-width: 100%; max-height: calc(100vh - 120px); margin: 0 auto; }
.lb-video { position: relative; aspect-ratio: 16 / 9; }
.lb-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.lb-caption { margin: 0; padding: 12px 52px 14px 18px; font-size: .92rem; color: #b9c2cf; }
.lb-caption strong { color: #fff; font-weight: 600; }
.lb-close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 1.5rem; line-height: 1; cursor: pointer; }
